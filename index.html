<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #2368d6);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(235, 235, 235, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 35px;
            color: white;
            box-shadow: 0px 10px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 18px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: none;
            outline: none;
            border-radius: 12px;
            background: rgb(248, 245, 245);
            color: #000;
            font-size: 15px;
            transition: 0.3s;
        }

        input::placeholder {
            color: #555;
        }

        input:focus {
            background: white;
            border: 1px solid #38bdf8;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #06b6d4, #3b82f6);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* BOTÃO WHATSAPP */
        .btn-whats {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            background: #25d366;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-whats:hover {
            background: #1ebe5d;
            transform: translateY(-2px);
        }

        .tabela-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 30px;
        }

        table {
            width: 100%;
            min-width: 700px;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 15px;
        }

        table th {
            background: rgba(255, 255, 255, 0.12);
            padding: 14px;
            font-weight: 500;
            text-align: center;
        }

        table td {
            padding: 14px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
        }

        table tr:hover td {
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-excluir {
            background: linear-gradient(90deg, #ef4444, #dc2626);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            width: auto;
        }

        .btn-excluir:hover {
            opacity: 0.8;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 768px) {

            body {
                padding: 15px;
                align-items: flex-start;
            }

            .container {
                padding: 20px;
                border-radius: 18px;
            }

            h1 {
                font-size: 24px;
            }

            input,
            button,
            .btn-whats {
                font-size: 14px;
                padding: 12px;
            }

            table th,
            table td {
                padding: 10px;
                font-size: 13px;
            }

            .btn-excluir {
                font-size: 12px;
                padding: 8px 10px;
            }
        }

        @media (max-width: 480px) {

            .container {
                padding: 15px;
            }

            h1 {
                font-size: 20px;
            }

            input,
            button,
            .btn-whats {
                font-size: 13px;
                padding: 10px;
            }

            table {
                min-width: 600px;
            }

            table th,
            table td {
                font-size: 12px;
                padding: 8px;
            }

            .btn-excluir {
                font-size: 11px;
                padding: 6px 8px;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Cadastro de Clientes</h1>

        <div class="form-group">
            <input type="text" id="nome" placeholder="Digite o nome completo">
        </div>

        <div class="form-group">
            <input type="email" id="email" placeholder="Digite o email">
        </div>

        <div class="form-group">
            <input type="text" id="cpf" placeholder="Digite o CPF">
        </div>

        <div class="form-group">
            <input type="text" id="celular" placeholder="Digite o celular">
        </div>

        <button onclick="salvarCliente()">
            Salvar Cliente
        </button>

        <!-- BOTÃO WHATSAPP -->
        <a href="https://wa.me/5511979716117?text=Olá,%20quero%20um%20site"
            target="_blank"
            class="btn-whats">

            📱 Falar no WhatsApp

        </a>

    </div>

    <script>

        const api = 'http://localhost:3000/clientes';

        // SALVAR CLIENTE
        async function salvarCliente() {

            const nome = document.getElementById('nome').value.trim();

            const email = document.getElementById('email').value.trim();

            const cpf = document.getElementById('cpf').value.trim();

            const celular = document.getElementById('celular').value.trim();

            // VALIDAÇÕES

            if (nome === '') {
                alert('Digite o nome!');
                return;
            }

            if (email === '') {
                alert('Digite o email!');
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                alert('Digite um email válido!');
                return;
            }

            if (cpf === '') {
                alert('Digite o CPF!');
                return;
            }

            if (cpf.length < 11) {
                alert('CPF inválido!');
                return;
            }

            if (celular === '') {
                alert('Digite o celular!');
                return;
            }

            try {

                await fetch(api, {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        nome,
                        email,
                        cpf,
                        celular
                    })

                });

                alert('Cliente cadastrado com sucesso!');

                document.getElementById('nome').value = '';
                document.getElementById('email').value = '';
                document.getElementById('cpf').value = '';
                document.getElementById('celular').value = '';

            } catch (erro) {

                alert('Erro ao cadastrar!');

                console.log(erro);

            }

        }

    </script>

</body>

</html>
